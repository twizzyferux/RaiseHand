name: Build Flet iOS App

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install build toolchain
        run: |
          uv sync --group build
          uv run flet --version --json

      - name: Build IPA
        run: |
          uv run flet build ipa \
            --yes \
            --verbose \
            --module-name main.py \
            --python-version 3.12 \
            --build-number "${{ github.run_number }}" \
            --build-version "0.1.0" \
            --output build/ipa

      - name: Pack unsigned IPA from xcarchive
        id: ipa
        run: |
          set -eu
          # Без Apple Developer профиля flet отдаёт .xcarchive, не .ipa.
          # Sideloadly подпишет zip Payload/*.app — собираем его вручную.
          OUT_DIR="${{ github.workspace }}/dist"
          mkdir -p "$OUT_DIR"
          IPA_OUT="$OUT_DIR/RaiseHand.ipa"

          echo "=== build tree (app/archive) ==="
          find build -maxdepth 8 \( -type d -name '*.app' -o -type d -name '*.xcarchive' -o -type f -name '*.ipa' \) 2>/dev/null | head -60 || true

          IPA="$(find build -type f -name '*.ipa' 2>/dev/null | head -1 || true)"
          if [ -n "${IPA}" ]; then
            cp "$IPA" "$IPA_OUT"
            echo "path=$IPA_OUT" >> "$GITHUB_OUTPUT"
            ls -lh "$IPA_OUT"
            exit 0
          fi

          APP="$(find build -type d -name '*.app' -path '*Products/Applications*' 2>/dev/null | head -1 || true)"
          if [ -z "${APP}" ]; then
            APP="$(find build -type d -name '*.app' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "${APP}" ]; then
            echo "No .app / .ipa found under build/"
            exit 1
          fi

          echo "Packing from: $APP"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (
            cd "$STAGE"
            zip -qry "$IPA_OUT" Payload
          )
          rm -rf "$STAGE"
          echo "path=$IPA_OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_OUT"
          unzip -l "$IPA_OUT" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaiseHand-ios
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: RaiseHand iOS IPA ${{ github.run_number }}
          body: |
            Свежая iOS-сборка RaiseHand (Flet), unsigned.
            Скачай `RaiseHand.ipa` и поставь через Sideloadly / AltStore со своим Apple ID.
          files: ${{ steps.ipa.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
