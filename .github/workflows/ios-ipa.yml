# Сборка .ipa на облачном Mac.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ
# ---------------
# .ipa собирается только на macOS с Xcode. На Windows и Linux его
# собрать нельзя вообще — это ограничение Apple, а не проекта.
# Обход: GitHub запускает ту же сборку на своей macOS-машине. Windows
# тут только как терминал: он отправляет код и забирает готовый файл.
#
# Свою сборку на Codemagic этот файл не заменяет, а дублирует: если
# аккаунта Codemagic нет, способ есть один этот.
#
# КАК ПОЛЬЗОВАТЬСЯ
# ----------------
#   1. Создать репозиторий на GitHub и залить в него проект.
#   2. Открыть Actions -> iOS IPA -> Run workflow.
#   3. Когда сборка пройдёт, скачать raisehand-ios (.ipa).
#   4. Ставить на телефон через Sideloadly или AltStore с Windows.
#
# ПОДПИСЬ
# --------
# Подписи здесь нет: бесплатный Apple ID даёт её сам Sideloadly при
# установке. Сборка без подписи занимает 20-40 минут в первый раз.

name: iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # macos-latest — облачная машина GitHub с macOS и Xcode.
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      APP_NAME: RaiseHand
      BUNDLE_ID: org.school.raisehand

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить системные зависимости
        run: |
          brew install python@3.12 autoconf automake libtool pkg-config
          brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf

      - name: Поставить kivy-ios
        run: |
          echo "$HOME/Library/Python/3.12/bin" >> $GITHUB_PATH
          pip3 install --user --upgrade kivy-ios cython

      - name: Создать заготовку приложения
        run: |
          export PATH="$HOME/Library/Python/3.12/bin:$PATH"
          kivy-ios init $APP_NAME

      - name: Сложить проект в заготовку
        run: |
          BUNDLE="$HOME/ios/$APP_NAME.app"
          rsync -a --exclude '.git*' \
                --exclude '.venv*' \
                --exclude 'проект' \
                --exclude '_shots' \
                --exclude 'tools' \
                --exclude '*.md' \
                "$GITHUB_WORKSPACE/" "$BUNDLE/"
          ls -la "$BUNDLE" | head -30

      - name: Собрать Python и зависимости под iOS
        run: |
          cd $HOME/ios
          export PATH="$HOME/Library/Python/3.12/bin:$PATH"
          toolchain build $APP_NAME

      - name: Собрать .ipa
        # toolchain create умеет подписывать, а подписи здесь нет, поэтому
        # он может споткнуться. Тогда собираем .ipa вручную: .ipa — это
        # просто zip с правильной структурой, а подпись потом ставит
        # Sideloadly.
        continue-on-error: true
        run: |
          cd $HOME/ios
          export PATH="$HOME/Library/Python/3.12/bin:$PATH"
          toolchain create $APP_NAME $BUNDLE_ID || true

      - name: Доделать .ipa вручную, если не собрался
        if: ${{ !hashFiles(format('{0}/ios/{1}.ipa', github.workspace, env.APP_NAME)) }}
        run: |
          cd $HOME/ios
          APP="$HOME/ios/$APP_NAME.app"
          if [ ! -d "$APP" ]; then
            echo "Заготовка $APP не найдена — сборка не удалась"
            ls -la $HOME/ios
            exit 1
          fi
          # Внутри .ipa должна лежать папка Payload с приложением.
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/$APP_NAME.ipa" Payload
          echo "--- что внутри .ipa ---"
          unzip -l "$GITHUB_WORKSPACE/$APP_NAME.ipa" | head -20

      - name: Отдать файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: raisehand-ios
          path: |
            ${{ github.workspace }}/${{ env.APP_NAME }}.ipa
            ${{ github.workspace }}/*.ipa
          if-no-files-found: error