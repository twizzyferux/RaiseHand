name: Build Flet iOS App

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build IPA
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-version: "0.1.0"
          build-number: "${{ github.run_number }}"
          archive-output: "true"
          extra-args: "--module-name main.py"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaiseHand-ios
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: RaiseHand iOS IPA ${{ github.run_number }}
          body: |
            Свежая iOS-сборка RaiseHand.
            Скачай IPA из Assets и поставь через Sideloadly / AltStore.
          files: ${{ steps.build.outputs.archive-path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
