name: Build Flet iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UV_PYTHON: "3.12"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build IPA
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          runner-python-version: "3.12"
          bundled-python-version: "3.12"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: flet-ios-app
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          archive: false