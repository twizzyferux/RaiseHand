# Build the .ipa on a cloud Mac.
#
# WHY THIS FILE
# -------------
# An .ipa can only be built on macOS with Xcode. It cannot be built on
# Windows or Linux at all - that is Apple's restriction, not a project
# setting. The workaround: GitHub runs the very same build on its own
# macOS machine. Windows is only a terminal here - it sends the code
# and downloads the finished file.
#
# This duplicates codemagic.yaml. If you have no Codemagic account,
# this file is the only way to build.
#
# HOW TO USE
# ---------
#   1. Push a change to master, or open Actions -> iOS IPA -> Run
#      workflow.
#   2. Wait 20-40 minutes (Python is compiled for iOS on the first run).
#   3. Download the raisehand-ios artifact - it contains the .ipa.
#   4. Install from Windows with Sideloadly or AltStore. They sign the
#      app with a free Apple ID, so no signature is needed here.
#
# SIGNING
# -------
# There is no signature: Sideloadly adds it at install time.
#
# The file is deliberately plain ASCII. GitHub refuses to register a
# workflow whose YAML it cannot parse, and a workflow that is not
# registered does not appear in the Actions tab at all.

name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      APP_NAME: RaiseHand
      BUNDLE_ID: org.school.raisehand

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          brew install python@3.12 autoconf automake libtool pkg-config
          brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf

      - name: Install kivy-ios
        run: |
          echo "$HOME/Library/Python/3.12/bin" >> $GITHUB_PATH
          pip3 install --user --upgrade kivy-ios cython

      - name: Create app skeleton
        run: |
          export PATH="$HOME/Library/Python/3.12/bin:$PATH"
          kivy-ios init $APP_NAME

      - name: Copy project into the skeleton
        run: |
          BUNDLE="$HOME/ios/$APP_NAME.app"
          rsync -a --exclude .git --exclude .venv --exclude .opencode \
                --exclude _shots --exclude tools --exclude "*.md" \
                "$GITHUB_WORKSPACE/" "$BUNDLE/"
          ls -la "$BUNDLE"

      - name: Build Python for iOS
        run: |
          export PATH="$HOME/Library/Python/3.12/bin:$PATH"
          cd $HOME/ios
          toolchain build $APP_NAME

      - name: Create the ipa
        continue-on-error: true
        run: |
          export PATH="$HOME/Library/Python/3.12/bin:$PATH"
          cd $HOME/ios
          toolchain create $APP_NAME $BUNDLE_ID || true

      - name: Package the ipa by hand if needed
        run: |
          APP="$HOME/ios/$APP_NAME.app"
          if [ -f "$GITHUB_WORKSPACE/$APP_NAME.ipa" ]; then
            echo "ipa built by toolchain create"
            exit 0
          fi
          if [ ! -d "$APP" ]; then
            echo "Skeleton $APP not found"
            ls -la $HOME/ios
            exit 1
          fi
          cd $GITHUB_WORKSPACE
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$APP_NAME.ipa" Payload
          unzip -l "$APP_NAME.ipa" | head -20

      - name: Upload the ipa
        uses: actions/upload-artifact@v4
        with:
          name: raisehand-ios
          path: $APP_NAME.ipa
          if-no-files-found: error