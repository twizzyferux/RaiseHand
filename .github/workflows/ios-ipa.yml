# Build the .ipa on a cloud Mac.
#
# WHY THIS FILE
# -------------
# An .ipa can only be built on macOS with Xcode. It cannot be built on
# Windows or Linux at all - that is Apple's restriction, not a project
# setting. The workaround: GitHub runs the very same build on its own
# macOS machine. Windows is only a terminal here - it sends the code
# and downloads the finished file.
#
# This duplicates codemagic.yaml. If you have no Codemagic account,
# this file is the only way to build.
#
# HOW IT WORKS (checked against the kivy-ios source, version 2025.5.17)
# -------------------------------------------------------------------
# kivy-ios installs exactly ONE program: "toolchain". There is no
# "kivy-ios" executable and no init command - an old instruction that
# says "kivy-ios init AppName" is from an ancient version and fails
# with "No such file or directory".
#
# The real pipeline is:
#   toolchain build <recipes>   compile Python and SDL for iOS (slow)
#   toolchain pip install ...   put Kivy and our plugin into that Python
#   toolchain create <name> <dir>  generate the Xcode project
#   xcodebuild ...              build the app itself
#   zip into Payload            make an unsigned .ipa
#
# "toolchain create" only generates the Xcode project, it does NOT
# build the app. The app is built by xcodebuild.
#
# SIGNING
# -------
# The build is unsigned on purpose: Sideloadly signs the .ipa with a
# free Apple ID at install time.
#
# The file is deliberately plain ASCII. GitHub refuses to register a
# workflow whose YAML it cannot parse, and a workflow that is not
# registered does not appear in the Actions tab at all.

name: iOS IPA

# ЗАПУСК НА КАЖДЫЙ КОММИТ И ВРУЧНУЮ.
#
# Раньше автоматический запуск стоял убрать: минута на macOS съедает
# десять бесплатных минут, сборка идёт 20-40 минут, и каждый коммит
# запускал полный прогон. Приватному репозиторию хватало 5-6 сборок в
# месяц, и они уходили впустую.
#
# Теперь репозиторий публичный, а у публичных сборки на стандартных
# машинах бесплатны и без ограничения. Поэтому запуск вернулся: не
# надо думать, запускать ли сборку, - запустил коммит, получил .ipa.
#
# Запуск вручную оставлен тоже: иногда нужен артефакт без нового
# коммита.
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      APP_NAME: RaiseHand
      BUNDLE_ID: org.school.raisehand
      # toolchain create lowercases the name for the project folder
      # and for the .xcodeproj file, so the same value is used here.
      PROJ: raisehand
      # Working directory of kivy-ios.
      #
      # It is NOT ~/ios. In kivy_ios/toolchain.py the working directory
      # is taken from getcwd(), and build/, dist/ and .cache/ are
      # created underneath it. The folder itself is never created, so
      # cd-ing into a folder that does not exist fails. That folder is
      # ours, inside the workspace, and is empty on every fresh run.
      #
      # The name matters and must not be changed back to IOS_DIR. The
      # recipe named "ios" in kivy-ios reads the environment variable
      # "<RECIPE>_DIR" as the location of its own sources, so a variable
      # called IOS_DIR made that recipe copy the whole workspace into
      # build/ios/iphoneos-arm64/... which in turn contained build/, and
      # again - until copytree hit "File name too long".
      WORK_DIR: ${{ github.workspace }}/ios
      # Silences a warning printed by the Node.js runtime that runs the
      # official actions: it still calls the removed "punycode" module
      # and complains about it on every run. It is noise from the
      # action's own code, not a problem of this build, and it used to
      # stand out in the middle of the real diagnostics.
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          brew install python@3.12 autoconf automake libtool pkg-config
          brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf

      - name: Install kivy-ios
        # pip3 straight from the runner fails with "externally-managed
        # environment" (PEP 668): the system Python refuses to install
        # anything so it cannot be broken by a package. The way out is a
        # virtual environment. Its bin directory is prepended to PATH
        # for the following steps.
        #
        # python@3.12 from Homebrew is keg-only: it is NOT symlinked into
        # the main bin directory, so plain "python3.12" is not on PATH
        # and the full path has to be asked from brew.
        run: |
          PY312="$(brew --prefix python@3.12)/bin/python3.12"
          "$PY312" -m venv "$HOME/kivyvenv"
          echo "$HOME/kivyvenv/bin" >> $GITHUB_PATH
          "$HOME/kivyvenv/bin/pip" install --upgrade pip wheel
          "$HOME/kivyvenv/bin/pip" install "kivy-ios==2025.5.17" cython
          echo "--- installed ---"
          "$HOME/kivyvenv/bin/pip" list | grep -iE "kivy|cython"
          "$HOME/kivyvenv/bin/toolchain" --help | head -20

      - name: Restore the iOS toolchain
        # Compiling Python, SDL and Kivy for iOS takes a long time, and
        # there is nothing to gain from doing it on every attempt to fix
        # the steps that follow. toolchain skips recipes that are
        # already built, so restoring the result turns every next run
        # into a short one.
        #
        # Only dist is cached. The build folder holds intermediate
        # compilation output, and keeping it broke the ios recipe: it
        # copies that folder into itself, so a restored build folder
        # grew into "build/ios/iphoneos-arm64/ios/build/ios/
        # iphoneos-arm64/ios/..." until copytree ran out of path.
        #
        # The key carries the pinned kivy-ios version: bumping it gives
        # a fresh cache, keeping it reuses the compiled toolchain.
        uses: actions/cache@v4
        with:
          path: ios/dist
          key: kivyios-2025.5.17-${{ runner.os }}-${{ runner.arch }}

      - name: Build the iOS toolchain
        # This is the slow step: Python, SDL and Kivy are compiled from
        # source for the iOS target.
        run: |
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          # The build folder is wiped for the reason described above:
          # a leftover one makes the ios recipe nest copies of itself.
          rm -rf build
          toolchain build python3 libffi openssl sdl2 sdl2_image sdl2_mixer sdl2_ttf ios pyobjus kivy

      - name: Install the app dependencies for iOS
        # Kivy itself is NOT installed here - it is built by the "kivy"
        # recipe in the previous step, and that is the only way to get a
        # build for iOS.
        #
        # Why it matters: with "toolchain pip install kivy" the iOS
        # Python downloaded a ready-made build from PyPI. That build is
        # made for macOS, not for iOS, and the phone rejected it with
        # "dynamic module does not define module export function
        # (PyInit_kivy_properties)". The file loaded, but the compiled
        # module had no matching entry point. The recipe compiles Kivy
        # with the iOS Python and the iOS SDL2, which is why it works.
        #
        # Only the plugin is installed here: it is pure Python, so no
        # compilation is needed and a ready-made build is fine.
        run: |
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          toolchain pip install --upgrade "kivy-garden.frostedglass>=0.5.0"
          #
          # pyobjus - ОБЯЗАТЕЛЬНО. Это мост в iOS, без него не
          # работает ни одно системное окно (ui/ios_alert.py) и не
          # читаются безопасные отступы экрана (safe_insets в
          # core/platform_setup.py).
          #
          # Рецепта сборки в предыдущем шаге недостаточно: он
          # компилирует модуль, но не кладёт его в приложение. Первый
          # вариант пайплайна именно это и делал - собирал pyobjus и
          # молча забывал установить, поэтому окно на телефоне не
          # появлялось, а приложение откатывалось на окно Kivy без
          # всякой ошибки.
          #
          # Ставится именно в iOS-Python приложения, поэтому только
          # через toolchain pip: обычный pip ставит модуль в Python
          # сборщика, в пакет телефона он не попадёт.
          toolchain pip install pyobjus
          echo "--- pyobjus на месте? ---"
          toolchain pip show pyobjus || {
            echo "pyobjus НЕ УСТАНОВЛЕН - системные окна не появятся"
            exit 1
          }
          echo "--- what is in the iOS python ---"
          toolchain build_info | head -30

      - name: Put the project into the app folder
        # "toolchain create" takes the folder where the application
        # sources live as its second argument, so the project is copied
        # there first. Draft folders, snapshots and helper scripts are
        # not part of the app and are left out.
        run: |
          APP="$WORK_DIR/$APP_NAME.app"
          rm -rf "$APP"
          mkdir -p "$APP"
          rsync -a --exclude .git --exclude .venv --exclude .venv312 \
                --exclude .opencode --exclude _shots --exclude tools \
                --exclude "*.md" --exclude data --exclude ios \
                "$GITHUB_WORKSPACE/" "$APP/"
          echo "--- app folder ---"
          ls -la "$APP"
          ls -la "$APP/assets" 2>/dev/null | head -10

      - name: Create the Xcode project
        run: |
          cd "$WORK_DIR"
          # The generated project is removed first.
          #
          # The result folder is restored from cache, and that cache
          # already contains a project directory from a previous run.
          # cookiecutter refuses to generate into a folder that exists
          # ("OutputDirExistsException"), so without this the run only
          # works when nothing was cached yet.
          rm -rf "$WORK_DIR/${PROJ}-ios"
          toolchain create $APP_NAME "$WORK_DIR/$APP_NAME.app"
          echo "--- generated ---"
          ls -la "$WORK_DIR/${PROJ}-ios"

      - name: Put the app icon
        # kivy-ios takes the icon from the file icon.png next to the
        # generated project, not from our assets. The file is put there
        # after the project is created, so it does not matter where it
        # came from before.
        run: |
          cd "$WORK_DIR"
          cp "$WORK_DIR/${PROJ}-ios/icon.png" "$WORK_DIR/${PROJ}-ios/icon.original.png" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/assets/images/app-icon.png" "$WORK_DIR/${PROJ}-ios/icon.png"
          ls -la "$WORK_DIR/${PROJ}-ios" | head -20

      - name: Inspect the Xcode project
        # Printed before the build so that the real target and scheme
        # names are visible in the log. Guessing them was the reason the
        # previous run lost its error message.
        run: |
          cd "$WORK_DIR/${PROJ}-ios"
          ls -la
          xcodebuild -list -project "${PROJ}.xcodeproj"

      - name: Build the app
        # The log goes to a file instead of being piped into tail. With
        # a pipe the step reports the exit code of tail, so a failed
        # xcodebuild looked like a successful build and the real error
        # disappeared. Here pipefail is set, the full log is kept, and on
        # failure the error lines are printed.
        #
        # -derivedDataPath is NOT used: xcodebuild refuses to run with it
        # unless a scheme is also given ("The flag -scheme ... is
        # required when specifying -derivedDataPath"), and the project
        # generated by kivy-ios ships without an .xcscheme file. Without
        # that flag the default output folder is used instead.
        #
        # Two attempts: with -scheme if Xcode auto-created one, otherwise
        # with -target, which needs no scheme. Each attempt keeps its own
        # log, so a failure shows both and not just the last one.
        #
        # Signing is off because there is no certificate.
        run: |
          set -o pipefail
          cd "$WORK_DIR/${PROJ}-ios"
          LOGDIR="$GITHUB_WORKSPACE"
          COMMON=(-project "${PROJ}.xcodeproj" -sdk iphoneos
                  -configuration Release
                  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
                  CODE_SIGN_IDENTITY="")
          if xcodebuild "${COMMON[@]}" -scheme "$PROJ" \
               > "$LOGDIR/xcodebuild.scheme.log" 2>&1; then
            LOG="$LOGDIR/xcodebuild.scheme.log"; MODE="-scheme"
          elif xcodebuild "${COMMON[@]}" -target "$PROJ" \
               > "$LOGDIR/xcodebuild.target.log" 2>&1; then
            LOG="$LOGDIR/xcodebuild.target.log"; MODE="-target"
          else
            echo "=== attempt with -scheme ==="
            tail -25 "$LOGDIR/xcodebuild.scheme.log"
            echo "=== attempt with -target ==="
            grep -nE "error:|BUILD FAILED|The following build commands failed" \
              "$LOGDIR/xcodebuild.target.log" | head -30
            tail -60 "$LOGDIR/xcodebuild.target.log"
            exit 1
          fi
          echo "=== succeeded with $MODE ==="
          tail -20 "$LOG"
          echo "=== where the app landed ==="
          find "$WORK_DIR/${PROJ}-ios" -maxdepth 8 -name "*.app" -print

      - name: Pack the ipa
        # An .ipa is a zip containing a Payload folder with the .app.
        # Sideloadly re-signs it, so no signature is needed here.
        run: |
          # Where the built app can be.
          #
          # The two attempts put it in different places, and that is why
          # the previous run found nothing although the build had
          # succeeded. With -target the products go to the project
          # folder ("build/Release-iphoneos"), with -scheme they go to
          # the standard DerivedData folder in the home directory. Both
          # are searched.
          #
          # IDLE.app is excluded: it is the example app that comes with
          # the compiled Python and is not our application.
          APPDIR="$(find "$WORK_DIR" "$HOME/Library/Developer/Xcode/DerivedData" \
                   -type d -name '*.app' -path '*Release-iphoneos*' \
                   ! -name 'IDLE.app' 2>/dev/null | head -1)"
          if [ -z "$APPDIR" ]; then
            echo "No built .app found"
            echo "--- in the workspace ---"
            find "$WORK_DIR" -type d -name '*.app' 2>/dev/null | head -20
            echo "--- in DerivedData ---"
            find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name '*.app' 2>/dev/null | head -20
            exit 1
          fi
          echo "found: $APPDIR"
          #
          # What is actually inside the bundle.
          #
          # The phone gave nothing away: when a module fails to import
          # at startup the process dies before iOS starts recording
          # anything, so there is no crash report on the device at all.
          # The bundle is checked here instead, so the build itself
          # answers whether the Python modules made it in.
          echo "=== top level of the app ==="
          ls -la "$APPDIR"
          echo "=== python modules inside ==="
          for mod in kivy kivy_garden frostedglass _sqlite3 sqlite3 PIL; do
            cnt=$(find "$APPDIR" -name "*${mod}*" 2>/dev/null | wc -l | tr -d ' ')
            echo "$mod: $cnt"
          done
          echo "=== where python lives ==="
          find "$APPDIR" -maxdepth 4 -type d -name "site-packages" 2>/dev/null
          echo "=== our own code inside ==="
          find "$APPDIR" -name "config*" -o -name "core" -type d 2>/dev/null | head -10
          echo "=== first 40 entries ==="
          find "$APPDIR" -maxdepth 2 | head -40
          cd "$WORK_DIR"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APPDIR" Payload/
          zip -qry "$GITHUB_WORKSPACE/$APP_NAME.ipa" Payload
          echo "--- inside the ipa ---"
          unzip -l "$GITHUB_WORKSPACE/$APP_NAME.ipa" | head -20

      - name: Upload the ipa
        # The path must be written as a GitHub expression, not as a
        # shell variable. actions/upload-artifact does not run a shell:
        # "$APP_NAME.ipa" went there literally, as a file with that
        # exact name in its name, and the step failed with "No files
        # found" although the file existed. "${{ env.APP_NAME }}" is
        # substituted by GitHub itself, so the real name arrives.
        #
        # The wildcard is a second chance: if the name ever changes, the
        # .ipa is still picked up rather than missed silently.
        uses: actions/upload-artifact@v4
        with:
          name: raisehand-ios
          path: |
            ${{ env.APP_NAME }}.ipa
            ${{ github.workspace }}/*.ipa
          if-no-files-found: error