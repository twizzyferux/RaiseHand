# fly.toml app configuration file generated for raisehand-approver on 2026-11-14T15:24:00+03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'raisehand-approver'
primary_region = 'ams'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # ← БЫЛО "stop" или true, СТАЛО "off"
  auto_start_machines = true
  min_machines_running = 1     # ← БЫЛО 0, СТАЛО 1

[[vm]]
  memory = '2gb'
  cpus = 1
  memory_mb = 2048

[build]
  dockerfile = "Dockerfile"