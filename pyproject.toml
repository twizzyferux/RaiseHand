[project]
name = "raisehand"
version = "0.1.0"
description = "RaiseHand school messenger"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Без [cli]: flet-cli тянет watchdog, для которого нет iOS-wheel.
    "flet>=0.86.0,<2",
    "SQLAlchemy>=2.0",
    "bcrypt>=4.0",
    "passlib>=1.7.4",
    "PyJWT>=2.8",
]

[dependency-groups]
# Только для хоста сборки (GitHub Actions / локальный `flet build`)
build = [
    "flet[cli]>=0.86.0,<2",
]

[tool.flet]
org = "com.raisehand.app"
product = "RaiseHand"
company = "RaiseHand"
bundle_id = "com.raisehand.app"

[tool.flet.app]
module = "main.py"
exclude = [
    "discord_bot",
    "admin_panel",
    "scripts",
    "tools",
    "docs",
    "build",
    ".venv",
    ".venv312",
    ".idea",
    ".github",
    "проект",
    "school_messenger_plain.rar",
    "notification_sound.mp3",
]
